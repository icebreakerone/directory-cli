[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "directory-cli"
version = "0.1.0"
description = "Command-line client for the IB1 Directory member API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
directory = "directory_cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["directory_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
